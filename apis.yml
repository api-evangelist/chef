aid: chef
name: Chef
description: >-
  Chef (Progress Chef) provides infrastructure automation, compliance, and application delivery tooling. Chef exposes
  REST APIs for the Infra Server (managing nodes, cookbooks, roles, environments, and data bags), Chef Automate
  (visibility into convergence, compliance, and deployment), Habitat Builder (application packaging and delivery), and
  InSpec (a language and runner for security and compliance testing).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/chef/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
tags:
  - Application Delivery
  - Automation
  - Compliance
  - Configuration Management
  - DevOps
  - DevSecOps
  - Habitat
  - Infrastructure as Code
  - InSpec
created: '2024-01-15'
modified: '2026-06-20'
specificationVersion: '0.20'
apis:
  - aid: chef:chef-infra-server-api
    name: Chef Infra Server API
    description: >-
      REST API for managing nodes, cookbooks, roles, environments, data bags, clients, and users on the Chef Infra
      Server. Authentication uses Chef signed-header authentication with an RSA client key.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.chef.io/server/api_chef_server/
    baseURL: https://chef.example.com/organizations/example
    tags:
      - Configuration Management
      - Infrastructure
    properties:
      - type: Documentation
        url: https://docs.chef.io/server/api_chef_server/
      - type: Authentication
        url: https://docs.chef.io/server/server_security/
      - type: OpenAPI
        url: openapi/chef-infra-server-api-openapi.yml
      - type: Overlay
        url: overlays/chef-infra-server-api-overlay.yaml
  - aid: chef:chef-automate-api
    name: Chef Automate API
    description: >-
      REST API for Chef Automate providing visibility into infrastructure convergence, compliance scans, and application
      deployment. Includes compliance profiles, scan jobs, reports, IAM, and configuration management endpoints.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.chef.io/automate/api/
    baseURL: https://automate.example.com/api/v0
    tags:
      - Automation
      - Compliance
      - Observability
    properties:
      - type: Documentation
        url: https://docs.chef.io/automate/api/
      - type: Reference
        url: https://docs.chef.io/automate/api_swagger/
      - type: Authentication
        url: https://docs.chef.io/automate/api_tokens/
      - type: OpenAPI
        url: openapi/chef-automate-api-openapi.yml
      - type: Overlay
        url: overlays/chef-automate-api-overlay.yaml
  - aid: chef:chef-habitat-builder-api
    name: Chef Habitat Builder API
    description: >-
      REST API for Chef Habitat Builder, the package management service for Habitat application packages. Manages
      origins, packages, channels, and deployment events.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.habitat.sh/docs/using-builder/
    baseURL: https://bldr.habitat.sh/v1
    tags:
      - Application Packaging
      - Deployment
      - Habitat
    properties:
      - type: Documentation
        url: https://docs.habitat.sh/docs/using-builder/
      - type: Authentication
        url: https://docs.habitat.sh/docs/using-builder/
      - type: OpenAPI
        url: openapi/chef-habitat-builder-api-openapi.yml
      - type: Overlay
        url: overlays/chef-habitat-builder-api-overlay.yaml
  - aid: chef:chef-inspec
    name: Chef InSpec
    description: >-
      InSpec is an open-source language and runner for security and compliance testing. It is consumed via the InSpec
      CLI and Ruby DSL, and surfaced inside Chef Automate as compliance profiles, scan jobs, and reports.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.chef.io/inspec/
    tags:
      - Compliance
      - Security
      - Testing
    properties:
      - type: Documentation
        url: https://docs.chef.io/inspec/
      - type: GitHub
        url: https://github.com/inspec/inspec
