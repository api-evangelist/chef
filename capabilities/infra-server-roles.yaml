naftiko: 1.0.0-alpha2
info:
  label: Chef Infra Server API — Roles
  description: 'Chef Infra Server API — Roles. 3 operations. Lead operation: List roles. Self-contained Naftiko capability
    covering one Chef business surface.'
  tags:
  - Chef
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHEF_API_KEY: CHEF_API_KEY
capability:
  consumes:
  - type: http
    namespace: infra-server-roles
    baseUri: https://{server}/organizations/{org}
    description: Chef Infra Server API — Roles business capability. Self-contained, no shared references.
    resources:
    - name: roles
      path: /roles
      operations:
      - name: listroles
        method: GET
        description: List roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createrole
        method: POST
        description: Create a role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: roles-roleName
      path: /roles/{roleName}
      operations:
      - name: getrole
        method: GET
        description: Get a role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roleName
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-Ops-Authorization
      value: '{{env.CHEF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: infra-server-roles-rest
    port: 8080
    description: REST adapter for Chef Infra Server API — Roles. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/roles
      name: roles
      description: REST surface for roles.
      operations:
      - method: GET
        name: listroles
        description: List roles
        call: infra-server-roles.listroles
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createrole
        description: Create a role
        call: infra-server-roles.createrole
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/roles/{rolename}
      name: roles-rolename
      description: REST surface for roles-roleName.
      operations:
      - method: GET
        name: getrole
        description: Get a role
        call: infra-server-roles.getrole
        with:
          roleName: rest.roleName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: infra-server-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chef Infra Server API — Roles. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-roles
      description: List roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-roles.listroles
      outputParameters:
      - type: object
        mapping: $.
    - name: create-role
      description: Create a role
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: infra-server-roles.createrole
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-role
      description: Get a role
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-roles.getrole
      with:
        roleName: tools.roleName
      outputParameters:
      - type: object
        mapping: $.
