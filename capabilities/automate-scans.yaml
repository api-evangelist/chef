naftiko: 1.0.0-alpha2
info:
  label: Chef Automate API — Scans
  description: 'Chef Automate API — Scans. 1 operations. Lead operation: Create a compliance scan job. Self-contained Naftiko
    capability covering one Chef business surface.'
  tags:
  - Chef
  - Scans
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHEF_API_KEY: CHEF_API_KEY
capability:
  consumes:
  - type: http
    namespace: automate-scans
    baseUri: https://{automate}/api/v0
    description: Chef Automate API — Scans business capability. Self-contained, no shared references.
    resources:
    - name: compliance-scanner-jobs
      path: /compliance/scanner/jobs
      operations:
      - name: createscanjob
        method: POST
        description: Create a compliance scan job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: api-token
      value: '{{env.CHEF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: automate-scans-rest
    port: 8080
    description: REST adapter for Chef Automate API — Scans. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/compliance/scanner/jobs
      name: compliance-scanner-jobs
      description: REST surface for compliance-scanner-jobs.
      operations:
      - method: POST
        name: createscanjob
        description: Create a compliance scan job
        call: automate-scans.createscanjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: automate-scans-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chef Automate API — Scans. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-compliance-scan-job
      description: Create a compliance scan job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: automate-scans.createscanjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
