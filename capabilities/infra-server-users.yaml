naftiko: 1.0.0-alpha2
info:
  label: Chef Infra Server API — Users
  description: 'Chef Infra Server API — Users. 1 operations. Lead operation: List users. Self-contained Naftiko capability
    covering one Chef business surface.'
  tags:
  - Chef
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHEF_API_KEY: CHEF_API_KEY
capability:
  consumes:
  - type: http
    namespace: infra-server-users
    baseUri: https://{server}/organizations/{org}
    description: Chef Infra Server API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Ops-Authorization
      value: '{{env.CHEF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: infra-server-users-rest
    port: 8080
    description: REST adapter for Chef Infra Server API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List users
        call: infra-server-users.listusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: infra-server-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chef Infra Server API — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-users.listusers
      outputParameters:
      - type: object
        mapping: $.
