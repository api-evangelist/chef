naftiko: 1.0.0-alpha2
info:
  label: Chef Infra Server API — Nodes
  description: 'Chef Infra Server API — Nodes. 5 operations. Lead operation: List nodes. Self-contained Naftiko capability
    covering one Chef business surface.'
  tags:
  - Chef
  - Nodes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHEF_API_KEY: CHEF_API_KEY
capability:
  consumes:
  - type: http
    namespace: infra-server-nodes
    baseUri: https://{server}/organizations/{org}
    description: Chef Infra Server API — Nodes business capability. Self-contained, no shared references.
    resources:
    - name: nodes
      path: /nodes
      operations:
      - name: listnodes
        method: GET
        description: List nodes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnode
        method: POST
        description: Create a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: nodes-nodeName
      path: /nodes/{nodeName}
      operations:
      - name: getnode
        method: GET
        description: Get a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nodeName
          in: path
          type: string
          required: true
      - name: updatenode
        method: PUT
        description: Update a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nodeName
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletenode
        method: DELETE
        description: Delete a node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nodeName
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-Ops-Authorization
      value: '{{env.CHEF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: infra-server-nodes-rest
    port: 8080
    description: REST adapter for Chef Infra Server API — Nodes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/nodes
      name: nodes
      description: REST surface for nodes.
      operations:
      - method: GET
        name: listnodes
        description: List nodes
        call: infra-server-nodes.listnodes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnode
        description: Create a node
        call: infra-server-nodes.createnode
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/nodes/{nodename}
      name: nodes-nodename
      description: REST surface for nodes-nodeName.
      operations:
      - method: GET
        name: getnode
        description: Get a node
        call: infra-server-nodes.getnode
        with:
          nodeName: rest.nodeName
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatenode
        description: Update a node
        call: infra-server-nodes.updatenode
        with:
          nodeName: rest.nodeName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletenode
        description: Delete a node
        call: infra-server-nodes.deletenode
        with:
          nodeName: rest.nodeName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: infra-server-nodes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chef Infra Server API — Nodes. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-nodes
      description: List nodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-nodes.listnodes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-node
      description: Create a node
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: infra-server-nodes.createnode
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-node
      description: Get a node
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-nodes.getnode
      with:
        nodeName: tools.nodeName
      outputParameters:
      - type: object
        mapping: $.
    - name: update-node
      description: Update a node
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: infra-server-nodes.updatenode
      with:
        nodeName: tools.nodeName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-node
      description: Delete a node
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: infra-server-nodes.deletenode
      with:
        nodeName: tools.nodeName
      outputParameters:
      - type: object
        mapping: $.
