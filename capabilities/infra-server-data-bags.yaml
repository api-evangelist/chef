naftiko: 1.0.0-alpha2
info:
  label: Chef Infra Server API — Data Bags
  description: 'Chef Infra Server API — Data Bags. 1 operations. Lead operation: List data bags. Self-contained Naftiko capability
    covering one Chef business surface.'
  tags:
  - Chef
  - Data Bags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHEF_API_KEY: CHEF_API_KEY
capability:
  consumes:
  - type: http
    namespace: infra-server-data-bags
    baseUri: https://{server}/organizations/{org}
    description: Chef Infra Server API — Data Bags business capability. Self-contained, no shared references.
    resources:
    - name: data
      path: /data
      operations:
      - name: listdatabags
        method: GET
        description: List data bags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Ops-Authorization
      value: '{{env.CHEF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: infra-server-data-bags-rest
    port: 8080
    description: REST adapter for Chef Infra Server API — Data Bags. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/data
      name: data
      description: REST surface for data.
      operations:
      - method: GET
        name: listdatabags
        description: List data bags
        call: infra-server-data-bags.listdatabags
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: infra-server-data-bags-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chef Infra Server API — Data Bags. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-data-bags
      description: List data bags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: infra-server-data-bags.listdatabags
      outputParameters:
      - type: object
        mapping: $.
