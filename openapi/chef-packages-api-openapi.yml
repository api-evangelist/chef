openapi: 3.2.0
info:
  title: Chef Habitat Builder Packages API
  description: REST API for Chef Habitat Builder, the package management service for Habitat application packages. Manages origins, packages, channels, and deployment events.
  version: '1.0'
  contact:
    name: Chef Software
    url: https://www.chef.io/support
servers:
- url: https://bldr.habitat.sh/v1
  description: Public Habitat Builder
security:
- habitatToken: []
tags:
- name: Packages
paths:
  /depot/origins/{origin}/pkgs:
    get:
      operationId: listOriginPackages
      summary: List packages for an origin
      tags:
      - Packages
      parameters:
      - name: origin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Packages
  /depot/pkgs/{origin}/{pkg}:
    get:
      operationId: getPackage
      summary: Get a package
      tags:
      - Packages
      parameters:
      - name: origin
        in: path
        required: true
        schema:
          type: string
      - name: pkg
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Package versions
components:
  securitySchemes:
    habitatToken:
      type: http
      scheme: bearer
      bearerFormat: HabitatBuilderToken
externalDocs:
  description: Habitat Builder Documentation
  url: https://docs.habitat.sh/docs/using-builder/
