openapi: 3.2.0
info:
  title: Chef Nodes API
  version: '1.0'
  contact:
    name: Chef Software
    url: https://www.chef.io/support
  description: 'Operations tagged Nodes across 2 of this provider''s published API definitions: chef-automate-api-openapi.yml, chef-infra-server-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{automate}/api/v0
  description: Chef Automate
  variables:
    automate:
      default: automate.example.com
- url: https://{server}/organizations/{org}
  description: Chef Infra Server (per-organization)
  variables:
    server:
      default: chef.example.com
    org:
      default: example
tags:
- name: Nodes
paths:
  /cfgmgmt/nodes:
    get:
      operationId: listManagedNodes
      summary: List configuration management nodes
      tags:
      - Nodes
      responses:
        '200':
          description: Nodes list
      security:
      - apiToken: []
    servers:
    - url: https://{automate}/api/v0
      description: Chef Automate
      variables:
        automate:
          default: automate.example.com
  /nodes:
    get:
      operationId: listNodes
      summary: List nodes
      tags:
      - Nodes
      responses:
        '200':
          description: Node list
      security:
      - chefSignedAuth: []
    post:
      operationId: createNode
      summary: Create a node
      tags:
      - Nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Node created
      security:
      - chefSignedAuth: []
    servers:
    - url: https://{server}/organizations/{org}
      description: Chef Infra Server (per-organization)
      variables:
        server:
          default: chef.example.com
        org:
          default: example
  /nodes/{nodeName}:
    get:
      operationId: getNode
      summary: Get a node
      tags:
      - Nodes
      parameters:
      - name: nodeName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Node
      security:
      - chefSignedAuth: []
    put:
      operationId: updateNode
      summary: Update a node
      tags:
      - Nodes
      parameters:
      - name: nodeName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Node updated
      security:
      - chefSignedAuth: []
    delete:
      operationId: deleteNode
      summary: Delete a node
      tags:
      - Nodes
      parameters:
      - name: nodeName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Node deleted
      security:
      - chefSignedAuth: []
    servers:
    - url: https://{server}/organizations/{org}
      description: Chef Infra Server (per-organization)
      variables:
        server:
          default: chef.example.com
        org:
          default: example
components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: api-token
      description: API token issued through the Chef Automate UI or admin API.
    chefSignedAuth:
      type: apiKey
      in: header
      name: X-Ops-Authorization
      description: Chef signed-header authentication using an RSA key associated with a client.
x-refined-from:
- chef-automate-api-openapi.yml
- chef-infra-server-api-openapi.yml
