openapi: 3.2.0
info:
  title: Chef Habitat Builder Channels API
  description: REST API for Chef Habitat Builder, the package management service for Habitat application packages. Manages origins, packages, channels, and deployment events.
  version: '1.0'
  contact:
    name: Chef Software
    url: https://www.chef.io/support
servers:
- url: https://bldr.habitat.sh/v1
  description: Public Habitat Builder
security:
- habitatToken: []
tags:
- name: Channels
paths:
  /depot/channels/{origin}:
    get:
      operationId: listChannels
      summary: List channels for an origin
      tags:
      - Channels
      parameters:
      - name: origin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channels
components:
  securitySchemes:
    habitatToken:
      type: http
      scheme: bearer
      bearerFormat: HabitatBuilderToken
externalDocs:
  description: Habitat Builder Documentation
  url: https://docs.habitat.sh/docs/using-builder/
