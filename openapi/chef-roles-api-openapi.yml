openapi: 3.2.0
info:
  title: Chef Infra Server Roles API
  description: REST API for the Chef Infra Server. Manages nodes, cookbooks, roles, environments, data bags, clients, and users that drive Chef's infrastructure automation. Authentication uses RSA-signed request headers per the Chef Infra Server signed-header authentication scheme.
  version: '1.0'
  contact:
    name: Chef Software
    url: https://www.chef.io/support
servers:
- url: https://{server}/organizations/{org}
  description: Chef Infra Server (per-organization)
  variables:
    server:
      default: chef.example.com
    org:
      default: example
security:
- chefSignedAuth: []
tags:
- name: Roles
paths:
  /roles:
    get:
      operationId: listRoles
      summary: List roles
      tags:
      - Roles
      responses:
        '200':
          description: Role list
    post:
      operationId: createRole
      summary: Create a role
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Role created
  /roles/{roleName}:
    get:
      operationId: getRole
      summary: Get a role
      tags:
      - Roles
      parameters:
      - name: roleName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Role
components:
  securitySchemes:
    chefSignedAuth:
      type: apiKey
      in: header
      name: X-Ops-Authorization
      description: Chef signed-header authentication using an RSA key associated with a client.
externalDocs:
  description: Chef Infra Server API Documentation
  url: https://docs.chef.io/server/api_chef_server/
