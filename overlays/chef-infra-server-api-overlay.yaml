overlay: 1.0.0
info:
  title: API Evangelist enhancements for Chef Infra Server API
  version: 1.0.0
extends: openapi/chef-infra-server-api-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: chef
      x-apievangelist-api: chef-infra-server-api
      x-apievangelist-auth: signed-header
      x-apievangelist-artifacts:
        authentication: authentication/chef-authentication.yml
        conventions: conventions/chef-conventions.yml
        data-model: data-model/chef-data-model.yml
        lifecycle: lifecycle/chef-lifecycle.yml
  - target: $.info
    update:
      x-apievangelist-categories:
        - Configuration Management
        - Infrastructure as Code
        - DevOps
